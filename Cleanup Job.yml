resources:
  jobs:
    Cleanup_Job:
      name: Cleanup Job
      description: "Use to clean up the volume of patient_data from files older than a
        day. "
      email_notifications:
        on_failure:
          - chataloverick@gmail.com
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: DAYS
      tasks:
        - task_key: Cleanup_Task
          notebook_task:
            notebook_path: The-Virtual-ICU/Cleanup Notebook (patient_data Volume)
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/ChatalovErick/The-Virtual-ICU
        git_provider: gitHub
        git_branch: feature/vitals-ingestion
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
